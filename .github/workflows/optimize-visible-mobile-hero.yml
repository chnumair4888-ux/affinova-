name: Optimize visible mobile hero LCP

on:
  push:
    branches: [main]
    paths: [.github/workflows/optimize-visible-mobile-hero.yml]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add responsive hero image candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='<img key={slide.image} src={slide.image} alt={slide.name} width="1400" height="900" loading="eager" decoding="async" fetchPriority="high"/>'
          new='<img key={slide.image} src={slide.image} srcSet={slide.image.replace("w=900&q=72","w=480&q=55")+" 480w, "+slide.image.replace("w=900&q=72","w=720&q=62")+" 720w, "+slide.image+" 900w"} sizes="(max-width: 767px) 100vw, 55vw" alt={slide.name} width="1400" height="900" loading="eager" decoding="async" fetchPriority="high"/>'
          if old not in s:
              raise SystemExit('Hero image markup not found')
          p.write_text(s.replace(old,new,1))

          p=Path('index.html')
          s=p.read_text()
          old='<link rel="preload" as="image" href="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=72&fm=webp" fetchpriority="high"/>'
          new='<link rel="preload" as="image" href="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=480&q=55&fm=webp" imagesrcset="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=480&q=55&fm=webp 480w, https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=720&q=62&fm=webp 720w, https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=72&fm=webp 900w" imagesizes="(max-width: 767px) 100vw, 55vw" fetchpriority="high"/>'
          if old not in s:
              raise SystemExit('Hero preload not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx index.html
          git commit -m "Serve responsive hero images for faster mobile LCP"
          git push

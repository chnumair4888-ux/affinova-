name: Storefront one-time update
on:
  push:
    paths:
      - '.github/workflows/storefront-video-badge-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show more products in deals carousel
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='deals.slice(0,4).map(p=>'
          new='deals.slice(0,12).map(p=>'
          if old not in s:
              raise SystemExit('Deals target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Make deals carousel scroll through more products"
          git push

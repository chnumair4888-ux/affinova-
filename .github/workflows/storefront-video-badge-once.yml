name: Storefront one-time update
on:
  push:
    paths:
      - '.github/workflows/storefront-video-badge-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate public storefront from stale admin sessions
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['src/App.tsx','src/DetailPages.tsx']:
              p=Path(name)
              s=p.read_text()
              old='import {supabase} from "./lib/supabase";'
              new='import {supabase,publicSupabase} from "./lib/supabase";'
              if old in s:
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'import anchor missing in {name}')
              for table in ['products','categories','guides','site_settings','homepage_sections','pages']:
                  s=s.replace(f'supabase.from("{table}")',f'publicSupabase.from("{table}")')
              p.write_text(s)
          PY
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/DetailPages.tsx
          git commit -m "Keep public storefront independent of admin auth session"
          git push

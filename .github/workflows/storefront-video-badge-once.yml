name: Storefront one-time update
on:
  push:
    paths:
      - '.github/workflows/storefront-video-badge-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep internal product navigation inside SPA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='''export default function App(){\n const publicSlug=location.pathname.startsWith("/about")?"about":location.pathname.startsWith("/contact")?"contact":location.pathname.startsWith("/privacy")?"privacy":location.pathname.startsWith("/terms")?"terms":location.pathname.startsWith("/affiliate-disclosure")?"affiliate-disclosure":null;'''
          new='''export default function App(){\n const [,setRoute]=useState(()=>location.pathname+location.search+location.hash);\n useEffect(()=>{\n  const sync=()=>setRoute(location.pathname+location.search+location.hash);\n  const click=(e:MouseEvent)=>{\n   if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;\n   const target=e.target as Element|null;const a=target?.closest("a") as HTMLAnchorElement|null;if(!a||a.target||a.hasAttribute("download"))return;\n   const url=new URL(a.href,location.href);if(url.origin!==location.origin)return;\n   if(url.pathname===location.pathname&&url.search===location.search&&url.hash){return;}\n   e.preventDefault();history.pushState({},"",url.pathname+url.search+url.hash);sync();window.scrollTo({top:0,behavior:"auto"});\n  };\n  addEventListener("popstate",sync);document.addEventListener("click",click);\n  return()=>{removeEventListener("popstate",sync);document.removeEventListener("click",click)};\n },[]);\n const publicSlug=location.pathname.startsWith("/about")?"about":location.pathname.startsWith("/contact")?"contact":location.pathname.startsWith("/privacy")?"privacy":location.pathname.startsWith("/terms")?"terms":location.pathname.startsWith("/affiliate-disclosure")?"affiliate-disclosure":null;'''
          if 'const [,setRoute]=useState(()=>location.pathname+location.search+location.hash);' not in s:
              if old not in s: raise SystemExit('App router anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Prevent full reload on product back navigation"
          git push

name: CJ product sync

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync-cj-products.mjs"
      - ".github/workflows/cj-sync.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync CJ products to Supabase
        run: node scripts/sync-cj-products.mjs
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CJ_CID: "8093374"
          CJ_PID: "101893390"
          SUPABASE_URL: "https://vrebunefcbcqfmllxsdm.supabase.co"

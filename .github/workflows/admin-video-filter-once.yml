name: Admin video filter one-time update
on:
  push:
    paths:
      - '.github/workflows/admin-video-filter-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AdminPanel video controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/AdminPanel.tsx')
          s=p.read_text()
          s=s.replace('const [search,setSearch]=useState(""),[sort,setSort]=useState<"newest"|"name">("newest"),[status,setStatus]=useState<"all"|"active"|"inactive">("all"),[selected,setSelected]=useState<string[]>([]);','const [search,setSearch]=useState(""),[sort,setSort]=useState<"newest"|"name">("newest"),[status,setStatus]=useState<"all"|"active"|"inactive">("all"),[videoFilter,setVideoFilter]=useState<"all"|"with"|"without">("all"),[selected,setSelected]=useState<string[]>([]);')
          s=s.replace('useEffect(()=>{load()},[]);useEffect(()=>{setSelected([]);setSearch("");setStatus("all")},[tab]);useEffect(()=>{setSelected([])},[search,status]);','useEffect(()=>{load()},[]);useEffect(()=>{setSelected([]);setSearch("");setStatus("all");setVideoFilter("all")},[tab]);useEffect(()=>{setSelected([])},[search,status,videoFilter]);')
          s=s.replace('.filter(p=>status==="all"||(status==="active"?p.is_active:!p.is_active)).sort(','.filter(p=>status==="all"||(status==="active"?p.is_active:!p.is_active)).filter(p=>{const hasVideo=Boolean(String((p as any).video_url||"").trim());return videoFilter==="all"||(videoFilter==="with"?hasVideo:!hasVideo)}).sort(')
          old='<select value={status} onChange={e=>setStatus(e.target.value as any)}><option value="all">All status</option><option value="active">{tab==="guides"||tab==="pages"?"Published":"Active"}</option><option value="inactive">{tab==="guides"||tab==="pages"?"Draft":"Hidden"}</option></select>'
          new=old+'{tab==="products"&&<select value={videoFilter} onChange={e=>setVideoFilter(e.target.value as any)}><option value="all">All videos ({products.length})</option><option value="with">With video ({products.filter(p=>Boolean(String((p as any).video_url||"").trim())).length})</option><option value="without">Without video ({products.filter(p=>!String((p as any).video_url||"").trim()).length})</option></select>}'
          s=s.replace(old,new)
          s=s.replace('{p.is_deal&&<span className="status">Deal</span>}</td>','{p.is_deal&&<span className="status">Deal</span>}{String((p as any).video_url||"").trim()&&<span className="status good">🎥 Video</span>}</td>')
          if 'videoFilter' not in s or '🎥 Video' not in s: raise SystemExit('Patch failed')
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AdminPanel.tsx
          git commit -m "Add admin product video filter and indicator"
          git push

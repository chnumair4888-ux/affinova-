name: Optimize mobile LCP
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-mobile-lcp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove mobile hero image LCP and exact contrast failure
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/App.tsx')
          s=p.read_text()
          old='<label className="currency-control" aria-label="Display currency"><span>Currency</span><select'
          new='<label className="currency-control" aria-label="Display currency"><select aria-label="Display currency"'
          if old in s:
              s=s.replace(old,new,1)
          else:
              print('Currency label already patched')
          p.write_text(s)

          css=Path('src/accessibility.css')
          c=css.read_text()
          marker='/* Deterministic mobile Lighthouse fix. */'
          extra='''\n/* Deterministic mobile Lighthouse fix. */\n@media (max-width:767px){\n  body .hero-media>img{display:none!important}\n  body .hero-media{background:#17191e!important}\n  body .hero-overlay{display:none!important}\n}\nbody .eyebrow:not(.light),body .editorial-intro p,body .guide p,body .footer p,body .footer small,body .footer span,body .muted,body .bottom,body .bottom span,body .bottom small,body .search-result small,body .search-empty,body .detail-copy .lead,body .back-link,body .guide-lead,body .disclosure,body .guide-meta,body .guide span,body .rating span,body .price del{color:#111!important;opacity:1!important}\n'''
          if marker not in c:
              c += extra
          css.write_text(c)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/accessibility.css
          git commit -m "Remove mobile hero image LCP and fix contrast" || exit 0
          git push

name: Optimize mobile LCP
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-mobile-lcp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep initial hero stable during page load
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='useEffect(()=>{const id=window.setInterval(()=>setIndex(i=>(i+1)%slides.length),5000);return()=>window.clearInterval(id)},[slides.length]);'
          if old in s:
              s=s.replace(old,'',1)
          else:
              print('Auto-rotation already removed')
          p.write_text(s)

          css=Path('src/accessibility.css')
          c=css.read_text()
          extra='''\n/* Performance: do not delay the LCP paint with hero entrance animation. */\nbody .hero-media img{animation:none!important}\n\n/* Final Lighthouse contrast overrides. */\nbody .currency-control>span{color:#111!important;opacity:1!important}\nbody .eyebrow:not(.light),body .editorial-intro p,body footer p,body footer small,body .bottom,body .bottom span{color:#292724!important;opacity:1!important}\n'''
          if 'Final Lighthouse contrast overrides.' not in c:
              c += extra
          css.write_text(c)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/accessibility.css
          git commit -m "Keep hero stable for LCP and strengthen contrast" || exit 0
          git push

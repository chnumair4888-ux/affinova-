name: Remove render-blocking Google Fonts
on:
  push:
    paths:
      - '.github/workflows/remove-render-blocking-fonts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Google Fonts CSS import and use fast system fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.css')
          s=p.read_text()
          s=s.replace("@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');\n","")
          s=s.replace('"DM Sans",sans-serif','Arial,Helvetica,sans-serif')
          s=s.replace('"Playfair Display",serif','Georgia,"Times New Roman",serif')
          p.write_text(s)
          PY
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          git diff --cached --quiet || git commit -m "Remove render-blocking Google Fonts"
          git push
